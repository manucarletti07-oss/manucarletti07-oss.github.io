<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <!-- Sin esta etiqueta el móvil simula una pantalla de ordenador y Bootstrap no se adapta -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manu Carletti | Desarrollador Web</title>
  <meta name="description" content="Portfolio de Manu Carletti, desarrollador web junior. Proyectos, habilidades y contacto.">
  <!-- Open Graph: define la tarjeta que sale al compartir el enlace en LinkedIn u otras redes -->
  <meta property="og:title" content="Manu Carletti | Desarrollador Web">
  <meta property="og:description" content="Mira mis proyectos y habilidades.">
  <meta property="og:url" content="https://manucarletti07-oss.github.io">
  <!-- Bootstrap es el único framework CSS del proyecto, como pide el enunciado. Versión fijada
       (5.3.3) para que una actualización futura no cambie el aspecto sin avisar -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Mi CSS va el último: con la misma especificidad, la regla que aparece después gana,
       así puedo sobrescribir Bootstrap sin usar !important -->
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>

  <!-- ===== NAVEGACIÓN =====
       navbar-expand-md: en pantallas menores de 768 px el menú se esconde tras el botón
       hamburguesa y desde 768 px se muestra completo.
       fixed-top: el menú sigue visible al hacer scroll, para moverse entre secciones. -->
  <header>
    <nav class="navbar navbar-expand-md fixed-top barra-nav">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#inicio">Manu Carletti</a>
        <!-- data-bs-toggle y data-bs-target hacen que Bootstrap abra y cierre el menú
             sin que yo escriba JavaScript. aria-label describe el botón a lectores de pantalla -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menu" aria-controls="menu" aria-expanded="false"
                aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <!-- ms-auto empuja los enlaces a la derecha. gap-md-2 solo separa los enlaces
               cuando están en fila (desde tableta), no en el menú vertical del móvil -->
          <ul class="navbar-nav ms-auto align-items-md-center gap-md-2">
            <li class="nav-item"><a class="nav-link" href="#inicio">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="#sobre-mi">Sobre mí</a></li>
            <li class="nav-item"><a class="nav-link" href="#proyectos">Proyectos</a></li>
            <li class="nav-item"><a class="nav-link" href="#habilidades">Habilidades</a></li>
            <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
            <li class="nav-item">
