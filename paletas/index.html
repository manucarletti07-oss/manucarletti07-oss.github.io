<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador de paletas | Manu Carletti</title>
  <meta name="description" content="Generador de paletas de 5 colores con opción de fijar colores y copiar su código.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Reutilizo el tema del portfolio (variables, botones y modo oscuro) -->
  <link href="../css/estilos.css" rel="stylesheet">
  <link href="paletas.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <a href="../index.html" class="btn btn-outline-principal mb-4">← Volver al portfolio</a>
    <h1 class="titulo-hero">Generador de paletas</h1>
    <p class="lead">Genera combinaciones de 5 colores. Pulsa un código para copiarlo y el candado para fijar un color.</p>

    <button id="btn-generar" class="btn btn-principal mb-4">
      <i class="bi bi-arrow-repeat"></i> Generar paleta <small>(barra espaciadora)</small>
    </button>

    <!-- Las 5 muestras las crea paletas.js -->
    <div id="paleta" class="row g-3"></div>

    <!-- aria-live: los lectores de pantalla anuncian el aviso al copiar -->
    <p id="aviso" class="mt-3" role="status" aria-live="polite"></p>
  </main>

  <script src="paletas.js"></script>
</body>
</html>
